name: 部署站点

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一个时间只跑一个部署。创作者连续保存多篇时，新的构建会取消还没跑完的旧构建，
# 最终只部署最后一次内容——相当于把多次保存「攒成一次发布」。
# 代价：构建进行到一半被取消时，线上仍是上一个版本（不会出现半成品）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 仓库名不是 <用户>.github.io 时，站点在 /<仓库名>/ 子路径下，
      # 必须把 base 传给构建，否则 CSS、图片和链接会 404。
      # 如果以后绑定了自定义域名，把 base 改成 "/"。
      - name: 计算站点地址
        id: site
        run: |
          # GitHub Pages 的域名一律小写
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            BASE="/"
          else
            BASE="/${NAME}/"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "site=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
          echo "站点将部署到 https://${OWNER}.github.io${BASE}"

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.site }}
          BASE_PATH: ${{ steps.site.outputs.base }}

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
